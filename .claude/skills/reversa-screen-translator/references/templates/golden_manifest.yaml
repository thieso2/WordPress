# golden/manifest.yaml
#
# The manifest of golden files emitted by the Screen Translator. The Inspector consumes
# this file to build constructive parity tests when the legacy oracle is
# available and the capture was possible.
#
# In v1, automated capture via Docker/Wine/an emulator is OQ-02 (not implemented).
# This manifest describes the suggested command per screen; the user runs it manually.
# In projects with no executable oracle, this file may exist empty (a list of
# golden files with `present: false`) or not exist at all, and the Inspector ignores it.

schemaVersion: 1
generatedAt: <ISO-8601>
reversa:
  version: "x.y.z"
producedBy: screen-translator
sourcePlatform: <slug>
targetPlatform: <slug>
oracleAvailable: true | false
oracleHash: "sha256:<hash of the oracle's binary or container, where applicable>"
oracleCommand: "<the base command to invoke the oracle, e.g. 'docker run --rm -i legacy-atm:1.0'>"

normalizationRules:
  # The rules accepted in the byte-for-byte comparison. Anything outside them is a real divergence.
  - lineEndings: "\n"           # convert CRLF → LF before comparing
  - trimTrailingSpaces: false   # default: never trim
  - stripAnsiColors: false      # default: never strip; ANSI is part of the contract
  - normalizeUtf8: true         # convert mixed encodings to UTF-8
  - injectClock: "2026-01-01T00:00:00Z"  # a fake clock for a deterministic capture
  - seedRandom: 42              # a fixed seed

screens:
  - name: <screen-canonical-name>
    legacyOrigin: "<file:line>"
    capture:
      command: "<the full capture command, e.g. 'echo -e \"1\\n123456\\n0\\n\" | docker run --rm -i legacy-atm:1.0 > login_screen.txt'>"
      expectedExitCode: 0
      determinismStrategy: "fake-clock + fixed-seed"
    file: "login-screen.txt"        # a path relative to _reversa_sdd/screens/golden/
    format: "ansi-byte-stream"      # ansi-byte-stream | png | html-css-snapshot | raw
    present: true                   # false when the user has not run the capture yet
    captureBy: "<the-user-name-or-CI>"
    capturedAt: "<ISO-8601>"
    sha256: "<hash of the captured file, or null when present=false>"
    deviations: [DEV-XXX, DEV-YYY]  # the list of known deviations for this screen
    notes: "<specific observations, e.g. 'the oracle emits a trailing space that we ignore via trimTrailingSpaces in the comparison'>"

  - name: <second-screen>
    # ...

# Screens for which a deterministic capture was not possible.
nonDeterministic:
  - name: <screen-with-an-external-clock>
    reason: "<a description of the source of non-determinism>"
    fallback: "sample over N runs; the golden file = what is common to all of them"
    samples: 5
    deviations: [DEV-021]

# Screens in projects with no UI, or in skipped mode.
skipped:
  reason: "<e.g. the legacy system is pure batch, the Screen Translator agent was skipped>"
  emittedAt: <ISO-8601>
