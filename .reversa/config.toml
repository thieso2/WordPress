[engines]
installed = [
  "claude-code"
]

[analysis]
answer_mode = "file"
doc_level = "complete"

# Organization of the specs generated by the agents.
# This section is filled in by Reversa after the Scout suggests a structure
# and the user confirms their choice in the menu (right after the doc_level question).
# To show the menu again, remove the whole [specs] section and run Reversa again.
[specs]
layout = "feature-folder"              # constant "feature-folder" after the first run
granularity = "module"         # module | use-case | endpoint | hybrid | feature | custom
custom_folders = []      # filled in only when granularity == "custom"
scout_suggestion = "module"    # record of the Scout's original suggestion, immutable after the 1st run
decided_at = "2026-08-21T12:56:33Z"          # ISO 8601 timestamp of the user's choice
