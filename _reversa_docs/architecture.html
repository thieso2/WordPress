<!DOCTYPE html>

<head>

<style>
  :root{
    --bg:#0a0a12; --panel:rgba(16,16,24,.88); --line:#2a2a3a;
    --fg:#e8e8f0; --dim:#9494a8; --accent:#ff6b35;
  }
  *{box-sizing:border-box}
  body{margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
  #scene{position:fixed;inset:0;display:block}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;transform:translate(-50%,-50%);font-size:11px;line-height:1;
       padding:3px 6px;border-radius:4px;background:rgba(10,10,18,.82);border:1px solid var(--line);
       white-space:nowrap;color:var(--fg);letter-spacing:.2px}
  .lbl.hot{border-color:var(--accent);color:#fff}

  #sidebar{position:fixed;top:0;right:0;width:300px;height:100vh;padding:18px 16px 90px;
           background:var(--panel);backdrop-filter:blur(8px);border-left:1px solid var(--line);
           overflow-y:auto;font-size:13px}
  #sidebar h1{font-size:14px;margin:0 0 2px;letter-spacing:.3px}
  #sidebar .sub{color:var(--dim);font-size:11px;margin:0 0 16px;line-height:1.5}
  #sidebar h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
              margin:20px 0 8px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:5px}
  label{display:block;margin:11px 0;color:var(--fg)}
  label .v{float:right;color:var(--dim);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;margin-top:6px;accent-color:var(--accent)}
  input[type=checkbox]{accent-color:var(--accent);margin-right:7px;vertical-align:-1px}
  select{width:100%;margin-top:6px;padding:5px;background:#14141f;color:var(--fg);
         border:1px solid var(--line);border-radius:4px;font-size:12px}
  button{width:100%;margin-top:7px;padding:8px;background:#1c1c2a;color:var(--fg);
         border:1px solid var(--line);border-radius:5px;cursor:pointer;font-size:12px;font-family:inherit}
  button:hover{background:#26263a;border-color:#3c3c52}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .legend{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:11.5px}
  .sw{width:11px;height:11px;border-radius:50%;flex:none}
  .stat{display:flex;justify-content:space-between;margin:4px 0;font-size:11.5px;color:var(--dim)}
  .stat b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}

  #tip{position:fixed;pointer-events:none;z-index:20;max-width:290px;padding:10px 12px;
       background:rgba(10,10,18,.96);border:1px solid var(--line);border-radius:6px;
       font-size:12px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #tip .n{font-weight:600;margin-bottom:6px;font-size:13px}
  #tip .p{color:var(--dim);margin:6px 0 8px;line-height:1.45;font-size:11.5px}
  #tip .g{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:11.5px}
  #tip .g span:nth-child(odd){color:var(--dim)}
  #tip .g span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
  #tip .cyc{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);color:var(--accent);font-size:11px}

  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
          flex-direction:column;gap:14px;background:var(--bg);z-index:50;font-size:15px}
  .spin{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--accent);
        border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
       background:var(--bg);z-index:60;padding:32px}
  #err div{max-width:460px;text-align:center;line-height:1.6}
  #err h2{color:var(--accent);font-size:16px;margin:0 0 10px}
  #err p{color:var(--dim);font-size:13px;margin:0}
  #foot{position:fixed;left:14px;bottom:12px;font-size:10.5px;color:var(--dim);
        line-height:1.6;max-width:calc(100vw - 340px)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 16px;
         background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:12px;
         display:none;z-index:30}
  @media (max-width:820px){#sidebar{width:100%;height:46vh;top:auto;bottom:0;border-left:none;border-top:1px solid var(--line)}#foot{display:none}}
</style>
</head>

    { name: "Domain",       color: 0x34d399 },
    { name: "Presentation", color: 0xfbbf24 },
    { name: "Interfaces",   color: 0xfb7185 },
    { name: "Operations",   color: 0x94a3b8 }
  ],
  HARD_NODE_LIMIT: 5000
};
var LAYER_COLOR = {};
CFG.LAYERS.forEach(function (l) { LAYER_COLOR[l.name] = l.color; });

/* ------------------------------------------------------------------ *
 * Error and toast helpers  (ERR-01 .. ERR-10)
 * ------------------------------------------------------------------ */
function showError(title, msg) {
  var e = document.getElementById("err");
  document.getElementById("err-t").textContent = title;
  document.getElementById("err-m").textContent = msg;
  e.style.display = "flex";
  var l = document.getElementById("loader"); if (l) l.style.display = "none";
}
var toastTimer = null;
function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = "none"; }, 2600);
}

/* ERR-01: Three.js did not load */
if (typeof THREE === "undefined") {
  showError("Three.js did not load",
    "This visualization needs the Three.js library. Check that assets/vendor/three.min.js sits next to this file, then reload.");
  return;
}
/* ERR-02: no WebGL */
(function () {
  try {
    var c = document.createElement("canvas");
    if (!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl")))) {
      throw new Error("no webgl");
    }
  } catch (e) {
    showError("WebGL is not available",
      "Your browser or graphics driver does not support WebGL, which this 3D scene requires. Try a different browser, or enable hardware acceleration.");
    throw e;
  }
})();

/* ------------------------------------------------------------------ *
 * Data: window.RV_DATA when run by the Docs team, otherwise inline.
 * Never fetch(), because that breaks under file://
 * ------------------------------------------------------------------ */
var DATA;
try {
  if (window.RV_DATA && window.RV_DATA.modules) {
    DATA = { modules: window.RV_DATA.modules, deps: window.RV_DATA.deps };
  } else {
    DATA = JSON.parse(document.getElementById("data").textContent);
  }
} catch (e) {                                            /* ERR-03 */
  showError("The data could not be read",
    "The embedded JSON is malformed, so the graph cannot be built. " + e.message);
  throw e;
}
var MODULES = (DATA && DATA.modules) || [];
var RAWEDGES = (DATA && DATA.deps && DATA.deps.edges) || [];

if (!MODULES.length) {                                   /* ERR-04 */
  showError("Nothing to display",
    "No modules were found in the data, so there is no graph to draw.");
  return;
}
if (MODULES.length > CFG.HARD_NODE_LIMIT) {              /* ERR-05 */
  showError("Too many nodes",
    MODULES.length + " nodes exceeds the safe limit of " + CFG.HARD_NODE_LIMIT +
    ". Group the modules by folder before visualizing.");
  return;
}

/* ------------------------------------------------------------------ *
 * Graph model
 * ------------------------------------------------------------------ */
var byName = {};
var maxLoc = 1;
MODULES.forEach(function (m) { if (m.loc > maxLoc) maxLoc = m.loc; });

var nodes = MODULES.map(function (m, i) {
  var t = Math.sqrt(m.loc / maxLoc);
  var n = {
    i: i, id: m.name, m: m,
    x: (Math.random() - 0.5) * 260,
    y: (Math.random() - 0.5) * 200,
    z: (Math.random() - 0.5) * 260,
    vx: 0, vy: 0, vz: 0, fx: 0, fy: 0, fz: 0,
    mass: 1 + m.loc / 6000,
    radius: CFG.NODE_MIN + t * (CFG.NODE_MAX - CFG.NODE_MIN),
    color: LAYER_COLOR[m.layer] !== undefined ? LAYER_COLOR[m.layer] : 0x888888,
    visible: true
  };
  byName[m.name] = n;
  return n;
});

var edges = [];
RAWEDGES.forEach(function (e) {
  var s = byName[e.from], t = byName[e.to];
  if (s && t) edges.push({ s: s, t: t, w: e.weight || 1, cyc: !!e.inCycle });
});

var neighbours = {};
nodes.forEach(function (n) { neighbours[n.id] = {}; });
edges.forEach(function (e) { neighbours[e.s.id][e.t.id] = 1; neighbours[e.t.id][e.s.id] = 1; });

var cyclicEdgeCount = edges.filter(function (e) { return e.cyc; }).length;
var totalLoc = MODULES.reduce(function (a, m) { return a + m.loc; }, 0);
var biggestScc = 0;
MODULES.forEach(function (m) { if (m.sccSize > biggestScc) biggestScc = m.sccSize; });

/* ------------------------------------------------------------------ *
 * Scene, camera, renderer, lighting  (THREE_PATTERNS)
 * ------------------------------------------------------------------ */
var canvas = document.getElementById("scene");
var scene = new THREE.Scene();
scene.background = new THREE.Color(CFG.BG);
scene.fog = new THREE.Fog(CFG.BG, CFG.FOG_NEAR, CFG.FOG_FAR);

var camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 4000);
var SPREAD = 60 * Math.sqrt(nodes.length);        /* camera distance derives from scene size */
camera.position.set(SPREAD * 0.75, SPREAD * 0.62, SPREAD * 1.05);
camera.lookAt(0, 0, 0);

var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

scene.add(new THREE.AmbientLight(0xffffff, 0.34));
var hemi = new THREE.HemisphereLight(0xddeeff, 0x202028, 0.55);
hemi.position.set(0, 260, 0);
scene.add(hemi);
var dir = new THREE.DirectionalLight(0xffffff, 0.9);
dir.position.set(160, 300, 200);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.left = -500; dir.shadow.camera.right = 500;
dir.shadow.camera.top = 500;   dir.shadow.camera.bottom = -500;
scene.add(dir);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 40;
controls.maxDistance = 2200;

/* ERR-09: WebGL context lost */
canvas.addEventListener("webglcontextlost", function (ev) {
  ev.preventDefault();
  showToast("The graphics context was lost. Reload the page to continue.");
});

/* ------------------------------------------------------------------ *
 * Geometry: 44 nodes, so individual meshes rather than an InstancedMesh
 * (the reference sets the instancing threshold at 50 nodes). Individual
 * meshes give per-node opacity, which the click-to-isolate mode needs.
 * ------------------------------------------------------------------ */
var sphereGeo = new THREE.SphereGeometry(1, 22, 16);
var nodeGroup = new THREE.Group();
scene.add(nodeGroup);

nodes.forEach(function (n) {
  var mat = new THREE.MeshStandardMaterial({
    color: n.color, roughness: 0.42, metalness: 0.12,
    emissive: new THREE.Color(n.color).multiplyScalar(0.16),
    transparent: true, opacity: 1
  });
  var mesh = new THREE.Mesh(sphereGeo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData.node = n;
  n.mesh = mesh;
  n.baseColor = new THREE.Color(n.color);
  nodeGroup.add(mesh);
});

/* Edges: one LineSegments for normal, one for cyclic, so each gets its own colour */
function makeLines(color, opacity) {
  var geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(edges.length * 6), 3));
  var mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity });
  var ls = new THREE.LineSegments(geo, mat);
  ls.frustumCulled = false;
  scene.add(ls);
  return ls;
}
var linesNormal = makeLines(CFG.EDGE_COLOR, CFG.EDGE_OPACITY);
var linesCycle  = makeLines(CFG.EDGE_CYCLE, CFG.EDGE_CYCLE_OPACITY);

/* Direction arrows: cones near the target. 206 of them, so InstancedMesh. */
var coneGeo = new THREE.ConeGeometry(1.5, 5, 7);
coneGeo.translate(0, -2.5, 0);
var coneMat = new THREE.MeshBasicMaterial({ color: 0x8fb4e0, transparent: true, opacity: 0.55 });
var arrows = new THREE.InstancedMesh(coneGeo, coneMat, edges.length);
arrows.frustumCulled = false;
scene.add(arrows);
var dummy = new THREE.Object3D();
var upVec = new THREE.Vector3(0, 1, 0);
var dirVec = new THREE.Vector3();

/* ------------------------------------------------------------------ *
 * Force simulation
 * ------------------------------------------------------------------ */
var simFrame = 0, frozen = false;

function simulationStep() {
  var i, j, n;
  for (i = 0; i < nodes.length; i++) { n = nodes[i]; n.fx = 0; n.fy = 0; n.fz = 0; }

  for (i = 0; i < nodes.length; i++) {
    for (j = i + 1; j < nodes.length; j++) {
      var a = nodes[i], b = nodes[j];
      var dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      var d2 = dx * dx + dy * dy + dz * dz + 0.1;
      var d = Math.sqrt(d2);
      var f = CFG.REPULSION / d2;
      var fx = (dx / d) * f, fy = (dy / d) * f, fz = (dz / d) * f;
      a.fx -= fx; a.fy -= fy; a.fz -= fz;
      b.fx += fx; b.fy += fy; b.fz += fz;
    }
  }
  edges.forEach(function (e) {
    var dx = e.t.x - e.s.x, dy = e.t.y - e.s.y, dz = e.t.z - e.s.z;
    var f = CFG.ATTRACTION * e.w;
    e.s.fx += dx * f; e.s.fy += dy * f; e.s.fz += dz * f;
    e.t.fx -= dx * f; e.t.fy -= dy * f; e.t.fz -= dz * f;
  });
  nodes.forEach(function (n2) {
    n2.fx -= n2.x * CFG.CENTER_GRAVITY;
    n2.fy -= n2.y * CFG.CENTER_GRAVITY;
    n2.fz -= n2.z * CFG.CENTER_GRAVITY;
    n2.vx = (n2.vx + n2.fx / n2.mass) * CFG.DAMPING;
    n2.vy = (n2.vy + n2.fy / n2.mass) * CFG.DAMPING;
    n2.vz = (n2.vz + n2.fz / n2.mass) * CFG.DAMPING;
    if (!isFinite(n2.vx) || !isFinite(n2.vy) || !isFinite(n2.vz)) {   /* ERR-08 guard */
      n2.vx = n2.vy = n2.vz = 0;
    }
    n2.x += n2.vx; n2.y += n2.vy; n2.z += n2.vz;
  });
}

function syncNodes() {
  nodes.forEach(function (n) {
    n.mesh.position.set(n.x, n.y, n.z);
    var r = n.radius * CFG.NODE_SCALE;
    n.mesh.scale.set(r, r, r);
  });
}

function syncEdges() {
  var pn = linesNormal.geometry.attributes.position.array;
  var pc = linesCycle.geometry.attributes.position.array;
  var cn = 0, cc = 0, shown = 0;
  var only = state.onlyCycles, hi = state.highlightCycles;

  edges.forEach(function (e, idx) {
    var vis = e.s.visible && e.t.visible && (!only || e.cyc);
    if (isolated) {
      vis = vis && (e.s.id === isolated || e.t.id === isolated);
    }
    if (!vis) return;
    var arr, o;
    if (e.cyc && hi) { arr = pc; o = cc; cc += 6; } else { arr = pn; o = cn; cn += 6; }
    arr[o] = e.s.x; arr[o + 1] = e.s.y; arr[o + 2] = e.s.z;
    arr[o + 3] = e.t.x; arr[o + 4] = e.t.y; arr[o + 5] = e.t.z;

    if (state.showArrows && shown < edges.length) {
      dirVec.set(e.s.x - e.t.x, e.s.y - e.t.y, e.s.z - e.t.z).normalize();
      var back = e.t.radius * CFG.NODE_SCALE + 2.5;
      dummy.position.set(e.t.x + dirVec.x * back, e.t.y + dirVec.y * back, e.t.z + dirVec.z * back);
      dummy.quaternion.setFromUnitVectors(upVec, dirVec.clone().negate());
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      arrows.setMatrixAt(shown, dummy.matrix);
      shown++;
    }
  });

  for (var k = cn; k < pn.length; k++) pn[k] = 0;
  for (var k2 = cc; k2 < pc.length; k2++) pc[k2] = 0;
  linesNormal.geometry.attributes.position.needsUpdate = true;
  linesCycle.geometry.attributes.position.needsUpdate = true;
  linesNormal.geometry.setDrawRange(0, cn / 3);
  linesCycle.geometry.setDrawRange(0, cc / 3);

  dummy.scale.set(0, 0, 0); dummy.updateMatrix();
  for (var a2 = shown; a2 < edges.length; a2++) arrows.setMatrixAt(a2, dummy.matrix);
  arrows.count = edges.length;
  arrows.instanceMatrix.needsUpdate = true;
  arrows.visible = state.showArrows;
}

/* ------------------------------------------------------------------ *
 * Appearance: layer colour, cycle highlight, isolation dimming
 * ------------------------------------------------------------------ */
var isolated = null;

function applyAppearance() {
  nodes.forEach(function (n) {
    var mat = n.mesh.material;
    var inCycle = n.m.inCycle && state.highlightCycles;
    mat.color.set(inCycle ? CFG.CYCLE_COLOR : n.baseColor);
    mat.emissive.copy(mat.color).multiplyScalar(inCycle ? 0.3 : 0.16);

    var vis = n.visible;
    var dim = false;
    if (isolated) {
      dim = (n.id !== isolated) && !neighbours[isolated][n.id];
    }
    n.mesh.visible = vis;
    mat.opacity = dim ? CFG.DIM_OPACITY : 1;
    mat.needsUpdate = true;
  });
}

/* ------------------------------------------------------------------ *
 * Labels: HTML overlay projected from 3D. CSS2DRenderer lives in
 * examples/jsm, which this skill does not load, so labels are plain divs.
 * ------------------------------------------------------------------ */
var labelHost = document.getElementById("labels");
nodes.forEach(function (n) {
  var d = document.createElement("div");
  d.className = "lbl";
  d.textContent = n.m.name;
  d.style.display = "none";
  labelHost.appendChild(d);
  n.label = d;
});
var proj = new THREE.Vector3();

function syncLabels() {
  var w = window.innerWidth, h = window.innerHeight;
  var ranked = nodes.slice().sort(function (a, b) { return b.m.fanIn - a.m.fanIn; });
  var budget = state.showLabels ? nodes.length : CFG.MAX_LABELS;
  var used = 0;
  ranked.forEach(function (n) {
    var show = n.mesh.visible && n.mesh.material.opacity > 0.4;
    if (show && !state.showLabels) {
      var dist = camera.position.distanceTo(n.mesh.position);
      show = (dist < CFG.LABEL_DIST + n.m.fanIn * 22) || n.id === hoveredId || n.id === isolated;
    }
    if (show && used >= budget && n.id !== hoveredId && n.id !== isolated) show = false;
    if (!show) { n.label.style.display = "none"; return; }
    proj.copy(n.mesh.position).project(camera);
    if (proj.z > 1) { n.label.style.display = "none"; return; }
    used++;
    n.label.style.display = "block";
    n.label.style.left = ((proj.x * 0.5 + 0.5) * w) + "px";
    n.label.style.top = ((-proj.y * 0.5 + 0.5) * h - n.radius * CFG.NODE_SCALE - 10) + "px";
    n.label.classList.toggle("hot", !!(n.m.inCycle && state.highlightCycles));
  });
}

/* ------------------------------------------------------------------ *
 * Hover, click, double click
 * ------------------------------------------------------------------ */
var ray = new THREE.Raycaster();
var pointer = new THREE.Vector2();
var tip = document.getElementById("tip");
var hoveredId = null;

function pick(ev) {
  var r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(pointer, camera);
  var hits = ray.intersectObjects(nodeGroup.children, false);
  for (var i = 0; i < hits.length; i++) {
    if (hits[i].object.visible && hits[i].object.material.opacity > 0.4) return hits[i].object.userData.node;
  }
  return null;
}

renderer.domElement.addEventListener("pointermove", function (ev) {
  var n = pick(ev);
  if (!n) { hoveredId = null; tip.style.display = "none"; document.body.style.cursor = "default"; return; }
  hoveredId = n.id;
  document.body.style.cursor = "pointer";
  var m = n.m;
  tip.innerHTML =
    '<div class="n">' + m.name + "</div>" +
    '<div class="p">' + m.purpose + "</div>" +
    '<div class="g">' +
      "<span>Layer</span><span>" + m.layer + "</span>" +
      "<span>Lines of code</span><span>" + m.loc.toLocaleString() + "</span>" +
      "<span>Files</span><span>" + m.files + "</span>" +
      "<span>Complexity</span><span>" + m.complexityLabel + "</span>" +
      "<span>Depended on by</span><span>" + m.fanIn + "</span>" +
      "<span>Depends on</span><span>" + m.fanOut + "</span>" +
      "<span>Business rules</span><span>" + m.rules + "</span>" +
      "<span>Extension points</span><span>" + m.hooks + "</span>" +
    "</div>" +
    (m.inCycle
      ? '<div class="cyc">Inside the ' + m.sccSize + " module cycle. Every module in that set can reach every other one.</div>"
      : (m.fanIn === 0 ? '<div class="cyc">Terminal module. Nothing depends on it.</div>' : ""));
  tip.style.display = "block";
  var tw = tip.offsetWidth, th = tip.offsetHeight;
  var x = ev.clientX + 16, y = ev.clientY + 16;
  if (x + tw > window.innerWidth - 310) x = ev.clientX - tw - 16;
  if (y + th > window.innerHeight - 10) y = ev.clientY - th - 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

renderer.domElement.addEventListener("pointerleave", function () {
  hoveredId = null; tip.style.display = "none";
});

renderer.domElement.addEventListener("click", function (ev) {
  var n = pick(ev);
  if (!n) { isolated = null; applyAppearance(); showToast("Isolation cleared"); return; }
  isolated = (isolated === n.id) ? null : n.id;
  applyAppearance();
  showToast(isolated ? ("Isolated " + n.id + ". Click empty space to clear.") : "Isolation cleared");
});

renderer.domElement.addEventListener("dblclick", function (ev) {
  var n = pick(ev);
  if (!n) return;
  controls.target.set(n.x, n.y, n.z);
  var off = 90 + n.radius * 4;
  camera.position.set(n.x + off, n.y + off * 0.6, n.z + off);
});

/* ------------------------------------------------------------------ *
 * Sidebar
 * ------------------------------------------------------------------ */
var state = {
  repulsion: CFG.REPULSION, attraction: CFG.ATTRACTION, nodeScale: 1,
  layerFilter: "all", highlightCycles: true, showLabels: false,
  showArrows: true, onlyCycles: false
};
var LS = "arq3d.";

function reheat(frames) { simFrame = Math.max(0, CFG.MAX_SIM_FRAMES - (frames || CFG.RESTART_FRAMES)); frozen = false; }

function applyParam(p, v) {
  state[p] = v;
  if (p === "repulsion")  { CFG.REPULSION = v;  document.getElementById("v-rep").textContent = v; reheat(); }
  if (p === "attraction") { CFG.ATTRACTION = v; document.getElementById("v-att").textContent = v.toFixed(2); reheat(); }
  if (p === "nodeScale")  { CFG.NODE_SCALE = v; document.getElementById("v-scl").textContent = v.toFixed(1); syncNodes(); }
  if (p === "layerFilter") {
    nodes.forEach(function (n) { n.visible = (v === "all" || n.m.layer === v); });
    isolated = null; applyAppearance();
  }
  if (p === "highlightCycles" || p === "onlyCycles") applyAppearance();
}

function wire(el) {
  var p = el.dataset.param;
  var isCheck = el.type === "checkbox";
  var read = function () { return isCheck ? el.checked : parseFloat(el.value); };
  var saved = null;
  try { saved = localStorage.getItem(LS + p); } catch (e) { saved = null; }   /* ERR-10 */
  if (saved !== null) {
    try {
      if (isCheck) el.checked = saved === "true";
      else if (el.tagName === "SELECT") el.value = saved;
      else el.value = saved;
    } catch (e) { /* ignore a corrupt value */ }
  }
  var handler = function () {
    var v = (el.tagName === "SELECT") ? el.value : read();
    applyParam(p, v);
    try { localStorage.setItem(LS + p, String(v)); } catch (e) {}
  };
  el.addEventListener(el.tagName === "SELECT" || isCheck ? "change" : "input", handler);
  return handler;
}

/* Build the layer filter and legend from the data */
var sel = document.getElementById("flt");
var legend = document.getElementById("legend");
var counts = {};
MODULES.forEach(function (m) { counts[m.layer] = (counts[m.layer] || 0) + 1; });
CFG.LAYERS.forEach(function (l) {
  if (!counts[l.name]) return;
  var o = document.createElement("option");
  o.value = l.name; o.textContent = l.name + " (" + counts[l.name] + ")";
  sel.appendChild(o);
  var row = document.createElement("div");
  row.className = "legend";
  row.innerHTML = '<span class="sw" style="background:#' + l.color.toString(16).padStart(6, "0") + '"></span>' +
                  "<span>" + l.name + "</span>";
  legend.appendChild(row);
});
var rowC = document.createElement("div");
rowC.className = "legend";
rowC.innerHTML = '<span class="sw" style="background:#ff6b35"></span><span>Inside a dependency cycle</span>';
legend.appendChild(rowC);

var handlers = [];
["rep", "att", "scl", "flt", "cyc", "lbl", "arw", "onlyc"].forEach(function (id) {
  handlers.push(wire(document.getElementById(id)));
});
handlers.forEach(function (h) { h(); });

document.getElementById("s-nodes").textContent = nodes.length;
document.getElementById("s-edges").textContent = edges.length;
document.getElementById("s-cyc").textContent = cyclicEdgeCount;
document.getElementById("s-loc").textContent = totalLoc.toLocaleString();

document.getElementById("freeze").addEventListener("click", function () {
  frozen = !frozen;
  this.textContent = frozen ? "Resume simulation" : "Freeze simulation";
  showToast(frozen ? "Simulation frozen" : "Simulation resumed");
});

document.getElementById("reset").addEventListener("click", function () {
  try { Object.keys(state).forEach(function (k) { localStorage.removeItem(LS + k); }); } catch (e) {}
  isolated = null;
  nodes.forEach(function (n) {
    n.x = (Math.random() - 0.5) * 260; n.y = (Math.random() - 0.5) * 200; n.z = (Math.random() - 0.5) * 260;
    n.vx = n.vy = n.vz = 0; n.visible = true;
  });
  document.getElementById("rep").value = 800;
  document.getElementById("att").value = 0.04;
  document.getElementById("scl").value = 1;
  document.getElementById("flt").value = "all";
  document.getElementById("cyc").checked = true;
  document.getElementById("lbl").checked = false;
  document.getElementById("arw").checked = true;
  document.getElementById("onlyc").checked = false;
  handlers.forEach(function (h) { h(); });
  controls.target.set(0, 0, 0);
  camera.position.set(SPREAD * 0.75, SPREAD * 0.62, SPREAD * 1.05);
  reheat(CFG.MAX_SIM_FRAMES);
  showToast("View and settings reset");
});

document.getElementById("export-png").addEventListener("click", function () {
  renderer.render(scene, camera);
  renderer.domElement.toBlob(function (blob) {
    if (!blob) { showToast("The export failed in this browser"); return; }
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "wordpress-dependency-graph-3d.png"; a.click();
    URL.revokeObjectURL(url);
    showToast("PNG exported");
  });
});

/* ------------------------------------------------------------------ *
 * Footer note, resize, dispose
 * ------------------------------------------------------------------ */
document.getElementById("foot").innerHTML =
  "Drag to orbit, scroll to zoom, hover for detail. Click a node to isolate it, double click to focus.<br>" +
  nodes.length + " modules and " + edges.length + " dependencies, of which " + cyclicEdgeCount +
  " sit inside a cycle. Largest strongly connected component: " + biggestScc + " modules. " +
  "Node radius is lines of code, colour is architectural layer. Individual meshes were used rather than " +
  "an InstancedMesh because the node count is below the instancing threshold of 50.";

window.addEventListener("resize", function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener("beforeunload", function () {
  sphereGeo.dispose(); coneGeo.dispose();
  nodes.forEach(function (n) { n.mesh.material.dispose(); });
  linesNormal.geometry.dispose(); linesNormal.material.dispose();
  linesCycle.geometry.dispose(); linesCycle.material.dispose();
  coneMat.dispose();
  renderer.dispose();
});

/* ------------------------------------------------------------------ *
 * Render loop
 * ------------------------------------------------------------------ */
var firstFrame = true, slowFrames = 0, last = performance.now();

function tick() {
  requestAnimationFrame(tick);
  var now = performance.now(), dt = now - last; last = now;

  if (!frozen && simFrame < CFG.MAX_SIM_FRAMES) {
    simulationStep();
    syncNodes();
    simFrame++;
    if (simFrame === CFG.MAX_SIM_FRAMES) frozen = true;
  }
  syncEdges();
  controls.update();
  renderer.render(scene, camera);
  syncLabels();

  if (!firstFrame && dt > 34) { slowFrames++; } else if (dt < 25) { slowFrames = 0; }
  if (slowFrames === 90) {                                   /* ERR-06 */
    showToast("Frame rate is low. Turning off shadows to recover.");
    renderer.shadowMap.enabled = false;
    dir.castShadow = false;
    nodes.forEach(function (n) { n.mesh.castShadow = false; n.mesh.receiveShadow = false; });
    slowFrames++;
  }
  if (firstFrame) {
    firstFrame = false;
    var l = document.getElementById("loader");
    l.style.transition = "opacity .35s";
    l.style.opacity = "0";
    setTimeout(function () { l.style.display = "none"; }, 380);
  }
}
applyAppearance();
syncNodes();
tick();

})();
</script>
</body>
</html>
