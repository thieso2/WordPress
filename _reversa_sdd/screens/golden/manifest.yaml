# golden/manifest.yaml
#
# Emitted by the Screen Translator (Phase 2) for the 18 literal `web.*` screens.
# v1 does NOT automate capture (OQ-02). Each entry below carries the suggested command;
# run them against the Wave 0 parity oracle and set `present: true` with the sha256.
#
# ✅ RESOLVED 2026-08-22 (deferred item D-4). The Wave 0 oracle was built, seeded per
# data_migration_plan.md and captured. Every entry is present:true with a sha256, and
# DEV-001 ("no golden capture exists") is removed from every screen's deviations list —
# the condition it described no longer holds. The Inspector is unblocked for these screens.
#
# ⚠️ One capture is not a rendered page: see web.attachment. On a default WordPress 7.2
# install `wp_attachment_pages_enabled` is '0' and wp-includes/canonical.php:553
# 301-redirects attachment URLs to the file. Its golden is the redirect. This is a
# screen-inventory discrepancy and feeds deferred item D-7.

