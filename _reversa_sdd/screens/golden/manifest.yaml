# golden/manifest.yaml
#
# Emitted by the Screen Translator (Phase 2) for the 18 literal `web.*` screens.
# v1 does NOT automate capture (OQ-02). Each entry below carries the suggested command;
# run them against the Wave 0 parity oracle and set `present: true` with the sha256.
#
# Until then every entry is present:false and DEV-001 stays PENDING, which blocks the
# Inspector for these screens.

schemaVersion: 1
generatedAt: 2026-08-21T00:00:00Z
reversa:
  version: "1.2.58"
producedBy: screen-translator
sourcePlatform: php-server-rendered
targetPlatform: rails-hotwire
oracleAvailable: false        # the reference instance is built in Wave 0 (AD-08); not up yet
oracleHash: null
oracleCommand: "docker run --rm -p 8080:80 wordpress-oracle:7.2-alpha-63330"

# The oracle must be seeded with the corpus defined in data_migration_plan.md:
# all 16 post types, hierarchical + flat taxonomies, threaded comments, every role,
# drafts carrying 0000-00-00, serialized postmeta/options, 4-byte UTF-8, quote-heavy text.
# A capture against an under-seeded oracle proves very little.

normalizationRules:
  - lineEndings: "\n"
  - trimTrailingSpaces: false
  - stripAnsiColors: false          # n/a for HTML
  - normalizeUtf8: true
  - injectClock: "2026-01-01T00:00:00Z"
  - seedRandom: 42
  # HTML-specific normalization, beyond the template defaults:
  - stripNonces: true               # nonces are per-session; never comparable
  - stripAutoincrementIds: true     # post/comment ids differ between oracle and target
  - stripGuid: true                 # DEV: guid becomes a UUID in the target (T-07)
  - collapseWhitespaceBetweenTags: true
  - sortClassAttributeTokens: true  # block supports concatenate classes in registration
                                    # order (F-BSUP-01), which the target does not reproduce

