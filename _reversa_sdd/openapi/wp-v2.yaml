# OpenAPI 3.1 — WordPress REST API
#
# Generated by the Writer (Reversa) from wp-includes/rest-api/ and
# create_initial_post_types() / create_initial_taxonomies().
#
# SCOPE AND HONESTY NOTE
# ----------------------
# 🟢 CONFIRMED: namespaces, route patterns, HTTP methods, the permission model and the
#    validate→sanitize pipeline were all read from the source.
# 🟡 INFERRED: response schemas below are summarised from each controller's get_item_schema().
#    The authoritative, complete schema is served at runtime by the API itself
#    (OPTIONS on any route, or GET /wp-json/wp/v2 for the index).
# 🔴 GAP: rest_base for custom post types and taxonomies is set at registration time by
#    third-party code. Only the 11 built-in rest_base values are statically knowable.
#    A live site's true surface is larger than this document.

openapi: 3.1.0

info:
  title: WordPress REST API
  version: "wp/v2 (WordPress 7.2-alpha-63330)"
  description: |
    49 controllers across three namespaces. Every route is dispatched by
    `WP_REST_Server::dispatch()` through a fixed pipeline:

      rest_pre_dispatch filter  →  route match  →  has_valid_params()  →
      sanitize_params()  →  permission_callback  →  callback

    **Critical behaviour (BR-REST-05):** a route registered with **no** `permission_callback`
    skips the permission check entirely and is fully public. `register_rest_route()` emits a
    `_doing_it_wrong()` notice since 5.5.0 but still registers and serves the route.

    **Denial semantics (BR-REST-04, BR-REST-06):** a `permission_callback` returning `false`
    **or `null`** denies. The status is `401` when no user is authenticated and `403` when one is.
  contact:
    name: See _reversa_sdd/rest-api/ for the full unit specification

servers:
  - url: https://{host}/wp-json
    variables:
      host:
        default: example.com

tags:
  - name: posts
    description: Content — posts, pages, media, blocks, templates
  - name: taxonomy
    description: Categories, tags, taxonomies, terms
  - name: users
    description: Users and application passwords
  - name: comments
    description: Comments
  - name: site-editing
    description: Templates, template parts, global styles, navigation, fonts
  - name: settings
    description: Site settings, themes, plugins
  - name: abilities
    description: AI-invocable abilities (wp-abilities/v1)
  - name: site-health
    description: Diagnostics (wp-site-health/v1)

security:
  - cookieAuth: []
  - applicationPassword: []

paths:

  /wp/v2:
    get:
      tags: [settings]
      summary: API index — the authoritative route list for this site 🟢
      description: |
        Returns every registered route with its methods, args schema and endpoint metadata.
        **This is the only complete source of truth** for a given installation, because
        plugins register routes at runtime.
      responses:
        "200":
          description: Index document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Index" }

  /wp/v2/posts:
    get:
      tags: [posts]
      summary: List posts 🟢
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/context"
        - name: status
          in: query
          description: |
            🟢 Requires `edit_posts` for any value other than `publish`.
            Compare BR-QUERY-02: `post_status` is a **private** query var on the front end and
            can never be set from a URL there — the REST API is the sanctioned path.
          schema: { type: string, default: publish }
      responses:
        "200":
          description: A page of posts
          headers:
            X-WP-Total:       { schema: { type: integer }, description: "Total matching posts 🟢" }
            X-WP-TotalPages:  { schema: { type: integer }, description: "Total pages 🟢" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidParam" }
    post:
      tags: [posts]
      summary: Create a post 🟢
      description: |
        🟢 `post_status` is **derived from the date**, not accepted verbatim (BR-POST-01/02):
        a `publish` request with a date ≥ 60 s in the future is stored as `future`;
        a `future` request with a date < 60 s away is stored as `publish`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostCreate" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "400": { $ref: "#/components/responses/InvalidParam" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /wp/v2/posts/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [posts]
      summary: Retrieve a post 🟢
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [posts]
      summary: Update a post 🟢
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/PostCreate" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [posts]
      summary: Trash or permanently delete a post 🟢
      description: |
        🟢 Without `force=true` the post is **trashed** (status → `trash`), not deleted.
        `_wp_trash_meta_status` preserves the prior status for restore.
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Trashed or deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /wp/v2/pages:      { $ref: "#/components/pathItems/PostTypeCollection" }
  /wp/v2/media:      { $ref: "#/components/pathItems/PostTypeCollection" }
  /wp/v2/blocks:     { $ref: "#/components/pathItems/PostTypeCollection" }
  /wp/v2/menu-items: { $ref: "#/components/pathItems/PostTypeCollection" }
  /wp/v2/navigation: { $ref: "#/components/pathItems/PostTypeCollection" }

  /wp/v2/templates:
    get:
      tags: [site-editing]
      summary: List block templates 🟢
      description: "Backed by the `wp_template` post type (rest_base `templates`)."
      responses: { "200": { description: OK } }

  /wp/v2/template-parts:
    get: { tags: [site-editing], summary: "List template parts 🟢", responses: { "200": { description: OK } } }

  /wp/v2/global-styles/{id}:
    parameters: [ { $ref: "#/components/parameters/id" } ]
    get:
      tags: [site-editing]
      summary: Retrieve global styles 🟢
      description: |
        Backed by the `wp_global_styles` post type — **one post per theme** (BR-GS-03),
        created on first access. Merged origin cascade: default → blocks → theme → custom.
      responses: { "200": { description: OK } }

  /wp/v2/font-families:
    get: { tags: [site-editing], summary: "List font families 🟢", responses: { "200": { description: OK } } }
  /wp/v2/font-families/{font_family_id}/font-faces:
    parameters: [ { name: font_family_id, in: path, required: true, schema: { type: integer } } ]
    get: { tags: [site-editing], summary: "List font faces 🟢", responses: { "200": { description: OK } } }

  /wp/v2/categories:
    get:  { tags: [taxonomy], summary: "List categories 🟢", responses: { "200": { description: OK } } }
    post: { tags: [taxonomy], summary: "Create a category 🟢", responses: { "201": { description: Created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /wp/v2/tags:
    get:  { tags: [taxonomy], summary: "List tags 🟢", responses: { "200": { description: OK } } }
  /wp/v2/taxonomies:
    get:  { tags: [taxonomy], summary: "List registered taxonomies 🟢", responses: { "200": { description: OK } } }
  /wp/v2/types:
    get:  { tags: [posts], summary: "List registered post types 🟢", responses: { "200": { description: OK } } }
  /wp/v2/statuses:
    get:  { tags: [posts], summary: "List registered post statuses 🟢", responses: { "200": { description: OK } } }

  /wp/v2/comments:
    get:
      tags: [comments]
      summary: List comments 🟢
    post:
      tags: [comments]
      summary: Create a comment 🟢
      description: |
        🟢 Passes the same pipeline as `wp-comments-post.php`:
        duplicate check (409, BR-CMT-01) → flood filter (429, BR-CMT-04 — **core never
        returns true here**) → moderation decision (BR-CMT-05…09) → disallowed-list override
        (BR-CMT-10, which sets `trash` or `spam` depending on `EMPTY_TRASH_DAYS`).
      responses:
        "201": { description: Created — may be held for moderation }
        "409": { description: "Duplicate comment 🟢" }
        "429": { description: "Flood detected — only if a plugin implements throttling 🟢" }

  /wp/v2/users:
    get:  { tags: [users], summary: "List users 🟢 — requires `list_users`", responses: { "200": { description: OK }, "403": { $ref: "#/components/responses/Forbidden" } } }
    post: { tags: [users], summary: "Create a user 🟢 — requires `create_users`", responses: { "201": { description: Created }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /wp/v2/users/me:
    get:  { tags: [users], summary: "Current user 🟢", responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthenticated" } } }
  /wp/v2/users/{user_id}/application-passwords:
    parameters: [ { name: user_id, in: path, required: true, schema: { type: string, description: "Numeric id or the literal `me` 🟢" } } ]
    get:    { tags: [users], summary: "List application passwords 🟢", responses: { "200": { description: OK } } }
    post:   { tags: [users], summary: "Create an application password 🟢 — hashed with BLAKE2b", responses: { "201": { description: Created } } }
    delete: { tags: [users], summary: "Revoke all application passwords 🟢", responses: { "200": { description: Revoked } } }
  /wp/v2/users/{user_id}/application-passwords/introspect:
    parameters: [ { name: user_id, in: path, required: true, schema: { type: string } } ]
    get: { tags: [users], summary: "Introspect the password used for this request 🟢", responses: { "200": { description: OK } } }

  /wp/v2/settings:
    get:
      tags: [settings]
      summary: Read registered settings 🟢
      description: "Only options passed through `register_setting()` with `show_in_rest` are exposed (BR-OPT §Settings registry)."
      responses: { "200": { description: OK }, "403": { $ref: "#/components/responses/Forbidden" } }
    post:
      tags: [settings]
      summary: Update settings 🟢 — requires `manage_options`
      responses: { "200": { description: Updated }, "403": { $ref: "#/components/responses/Forbidden" } }

  /wp/v2/themes:
    get: { tags: [settings], summary: "List themes 🟢", responses: { "200": { description: OK } } }
  /wp/v2/plugins:
    get:  { tags: [settings], summary: "List plugins 🟢 — requires `activate_plugins`", responses: { "200": { description: OK }, "403": { $ref: "#/components/responses/Forbidden" } } }
    post: { tags: [settings], summary: "Install a plugin 🟢 — requires `install_plugins`", responses: { "201": { description: Installed }, "403": { $ref: "#/components/responses/Forbidden" } } }
  /wp/v2/search:
    get: { tags: [settings], summary: "Cross-type search 🟢 — pluggable search handlers", responses: { "200": { description: OK } } }
  /wp/v2/block-types:
    get: { tags: [posts], summary: "List registered block types 🟢", responses: { "200": { description: OK } } }
  /wp/v2/block-patterns/patterns:
    get: { tags: [posts], summary: "List block patterns 🟢", responses: { "200": { description: OK } } }

  /wp-block-editor/v1/url-details:
    get:
      tags: [site-editing]
      summary: Fetch metadata for a URL 🟢
      description: |
        ⚠️ **Server-side fetch of a caller-supplied URL.** Protected by
        `wp_http_validate_url()` — 13 blocked IPv4 ranges and a 3-port allowlist (BR-HTTP-08/10).
        See `../http-api/design.md` for the residual DNS-rebinding and IPv6 gaps (F-HTTP-03/04).
      parameters: [ { name: url, in: query, required: true, schema: { type: string, format: uri } } ]
      responses:
        "200": { description: OK }
        "403": { description: "URL rejected by the SSRF guard 🟢" }

  /wp-site-health/v1/tests/{test}:
    parameters: [ { name: test, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [site-health]
      summary: Run one async Site Health test 🟢
      description: "Async tests are fetched by JavaScript so a slow check (e.g. loopback) does not block page load (BR-SH-01)."
      responses: { "200": { description: "Result: good | recommended | critical 🟢" } }

  /wp-abilities/v1/abilities:
    get:
      tags: [abilities]
      summary: List registered abilities 🟢
      description: |
        🟢 Only abilities that explicitly opted in are listed — `DEFAULT_SHOW_IN_REST = false`
        and `DEFAULT_PUBLIC = false` (BR-AI-04). This is the **opposite** default to
        `register_rest_route()` (BR-REST-05). See ADR-012.
      responses: { "200": { description: OK } }
  /wp-abilities/v1/abilities/{name}:
    parameters: [ { name: name, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]+/[a-z0-9-]+$" } } ]
    get: { tags: [abilities], summary: "Describe one ability, including its input and output JSON Schema 🟢", responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } } }
  /wp-abilities/v1/abilities/{name}/run:
    parameters: [ { name: name, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]+/[a-z0-9-]+$" } } ]
    post:
      tags: [abilities]
      summary: Execute an ability 🟢
      description: |
        Five-stage pipeline (BR-AI-05):
        `normalize_input` → `validate_input` (JSON Schema) → `check_permissions` →
        `do_execute` → **`validate_output`** (JSON Schema).

        🟢 Output validation is unique in core — nothing else verifies that a callback returned
        what it promised (F-AI-02).

        🟡 Permissions are checked **after** input validation, so an unauthorized caller learns
        whether their input was well-formed (F-AI-03).
      responses:
        "200": { description: "Result, validated against the ability's output schema 🟢" }
        "400": { description: "Input failed JSON Schema validation 🟢" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /wp-abilities/v1/categories:
    get: { tags: [abilities], summary: "List ability categories 🟢", responses: { "200": { description: OK } } }

components:

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: wordpress_logged_in_{COOKIEHASH}
      description: |
        🟢 Cookie authentication **additionally requires a nonce** in the `X-WP-Nonce` header.
        The nonce is a time-windowed HMAC bound to user, action and session token — deterministic
        for 12 hours and therefore replayable within that window (F-AUTH-03).
    applicationPassword:
      type: http
      scheme: basic
      description: "🟢 HTTP Basic with an application password. Requires HTTPS. Hashed with BLAKE2b."

  parameters:
    id:       { name: id, in: path, required: true, schema: { type: integer } }
    page:     { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
    per_page: { name: per_page, in: query, schema: { type: integer, default: 10, minimum: 1, maximum: 100 } }
    search:
      name: search
      in: query
      schema: { type: string }
      description: |
        ⚠️ Backed by `WP_Query`'s `LIKE '%term%'` search with a stopword filter (F-QUERY-04).
        Single a–z characters and locale stopwords are dropped (BR-QUERY-09). No index is used
        and results are not ranked.
    context:
      name: context
      in: query
      schema: { type: string, enum: [view, embed, edit], default: view }
      description: "🟢 `edit` requires the corresponding edit capability and returns raw fields."

  responses:
    InvalidParam:
      description: "Schema validation failed before the callback ran (BR-REST-02) 🟢"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: "401 — no user is authenticated (BR-REST-06) 🟢"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: "403 — authenticated but not permitted (BR-REST-06) 🟢"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: "404"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  pathItems:
    PostTypeCollection:
      description: |
        🟡 Standard post-type collection. Every post type registered with `show_in_rest`
        gets the same five routes:
        `GET /{base}`, `POST /{base}`, `GET /{base}/{id}`, `POST /{base}/{id}`,
        `DELETE /{base}/{id}` — plus `/{base}/{id}/revisions` and `/{base}/{id}/autosaves`
        when the type supports revisions.
      get:
        summary: List items
        responses: { "200": { description: OK } }

  schemas:
    Error:
      type: object
      properties:
        code:    { type: string, example: rest_forbidden }
        message: { type: string }
        data:
          type: object
          properties:
            status: { type: integer, example: 403 }

    Index:
      type: object
      description: "🟢 The site's authoritative route list — the only complete API description."
      properties:
        name:        { type: string }
        description: { type: string }
        url:         { type: string, format: uri }
        namespaces:  { type: array, items: { type: string }, example: [wp/v2, wp-site-health/v1, wp-abilities/v1, wp-block-editor/v1] }
        routes:      { type: object, additionalProperties: true }

    Post:
      type: object
      description: "🟡 Summarised from WP_REST_Posts_Controller::get_item_schema(). The runtime schema is authoritative."
      properties:
        id:            { type: integer, readOnly: true }
        date:          { type: [string, "null"], format: date-time, description: "Site timezone" }
        date_gmt:      { type: [string, "null"], format: date-time, description: "🟢 `0000-00-00 00:00:00` for drafts (BR-POST-04)" }
        guid:          { type: object, readOnly: true, description: "🟢 Seeded from the permalink on first publish and never updated (BR-POST-10)" }
        modified:      { type: string, format: date-time, readOnly: true }
        modified_gmt:  { type: string, format: date-time, readOnly: true }
        slug:          { type: string, description: "🟢 Uniqueness scope depends on post type (BR-POST-06)" }
        status:        { type: string, enum: [publish, future, draft, pending, private, trash, auto-draft, inherit], description: "🟢 DERIVED from date on write (BR-POST-01/02)" }
        type:          { type: string, readOnly: true }
        link:          { type: string, format: uri, readOnly: true }
        title:         { type: object, properties: { raw: { type: string }, rendered: { type: string, readOnly: true } } }
        content:       { type: object, properties: { raw: { type: string, description: "🟢 Block markup — HTML with comment delimiters (ADR-008)" }, rendered: { type: string, readOnly: true }, protected: { type: boolean, readOnly: true } } }
        excerpt:       { type: object, properties: { raw: { type: string }, rendered: { type: string, readOnly: true } } }
        author:        { type: integer }
        featured_media: { type: integer, description: "🟢 Stored as the `_thumbnail_id` post meta" }
        comment_status: { type: string, enum: [open, closed] }
        ping_status:   { type: string, enum: [open, closed] }
        sticky:        { type: boolean }
        template:      { type: string, description: "🟢 Stored as `_wp_page_template`; validated by validate_file() (BR-TPL-11)" }
        format:        { type: string }
        meta:          { type: object, description: "🟢 Only keys registered via register_meta() with show_in_rest are exposed. Keys starting with `_` are protected (BR-META-04)." }
        categories:    { type: array, items: { type: integer }, description: "🟢 term_ids — the API accepts term_id even though relationships use term_taxonomy_id (F-TAX-01)" }
        tags:          { type: array, items: { type: integer } }

    PostCreate:
      allOf:
        - $ref: "#/components/schemas/Post"
      description: "🟢 Same shape; read-only fields ignored. `status` is re-derived from `date_gmt` (BR-POST-01/02)."
